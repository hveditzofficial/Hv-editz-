<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HV Editz | Official Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    background: #050505;
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    z-index: 100;
}

header h2 {
    color: #ffca05;
    font-size: 34px;
    letter-spacing: 5px;
    margin-bottom: 30px;
}

nav {
    display: flex;
    justify-content: center;
    gap: 35px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 19px;
    transition: 0.3s;
}

nav a:hover {
    color: #ffca05;
}

/* HOME */

.hero {
    min-height: 90vh;
    padding: 100px 20px 60px;
    text-align: center;
    background: radial-gradient(
        circle at center,
        #211500,
        #050505 65%
    );
}

/* LOGO */

.hero img {
    width: 450px;
    max-width: 90%;
    height: auto;
    display: block;
    margin: 0 auto 40px;
    border-radius: 0;
    box-shadow: 0 0 35px rgba(255,180,0,0.12);
}

/* MAIN TITLE */

.hero h1 {
    font-size: 75px;
    color: #ffca05;
    letter-spacing: 8px;
    margin-bottom: 25px;
}

/* TAGLINE */

.tagline {
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 7px;
    color: #ff3434;
    margin-bottom: 40px;
}

/* DESCRIPTION */

.hero p {
    max-width: 850px;
    margin: auto;
    color: #bbb;
    font-size: 23px;
    line-height: 1.9;
}

/* BUTTON */

.btn {
    display: inline-block;
    margin-top: 55px;
    padding: 24px 55px;
    background: linear-gradient(
        90deg,
        #ffcc00,
        #ff9d00,
        #ff3030
    );
    color: black;
    text-decoration: none;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #ff8500;
}

/* SECTIONS */

section {
    padding: 90px 25px;
    text-align: center;
}

.section-title {
    font-size: 42px;
    color: #ffca05;
    margin-bottom: 30px;
}

.section-text {
    max-width: 800px;
    margin: auto;
    color: #bbb;
    font-size: 19px;
    line-height: 1.8;
}

/* ABOUT */

.about {
    background: #101010;
}

/* SERVICES */

.services {
    background: #080808;
}

.service-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1100px;
    margin: 50px auto 0;
}

.service-card {
    background: #151515;
    padding: 40px 20px;
    border: 1px solid #333;
    border-radius: 15px;
    transition: 0.3s;
}

.service-card:hover {
    border-color: #ffca05;
    transform: translateY(-8px);
}

.service-card h3 {
    color: #ffca05;
    margin-bottom: 20px;
    font-size: 23px;
}

.service-card p {
    color: #bbb;
    line-height: 1.7;
}

/* CONTACT */

.contact {
    background: #101010;
}

/* FOOTER */

footer {
    padding: 40px 20px;
    background: #050505;
    text-align: center;
    border-top: 1px solid #222;
}

footer h2 {
    color: #ffca05;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

footer p {
    color: #888;
}

/* MOBILE */

@media(max-width: 768px) {

    header h2 {
        font-size: 29px;
    }

    nav {
        gap: 22px;
    }

    nav a {
        font-size: 16px;
    }

    .hero {
        padding: 105px 20px 55px;
    }

    .hero img {
        width: 450px;
    }

    .hero h1 {
        font-size: 47px;
        letter-spacing: 5px;
    }

    .tagline {
        font-size: 21px;
        letter-spacing: 4px;
    }

    .hero p {
        font-size: 18px;
        line-height: 2;
    }

    .btn {
        padding: 20px 30px;
        font-size: 17px;
    }

    .service-container {
        grid-template-columns: 1fr;
    }

    .section-title {
        font-size: 32px;
    }
}

@media(max-width: 380px) {
    nav {
        gap: 15px;
    }

    nav a {
        font-size: 14px;
    }

    .hero h1 {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>
    <h2>HV EDITZ</h2>

    <nav>
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
</header>
